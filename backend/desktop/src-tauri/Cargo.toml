[package]
name = "soundcloud-dl-desktop"
version = "0.1.0"
description = "SoundCloud and Rekordbox preparation desktop app"
authors = ["SoundCloud DL"]
edition = "2021"

[lib]
name = "soundcloud_dl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "process"] }
