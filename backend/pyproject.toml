[project]
name = "soundcloud-rekordbox-dl"
version = "0.1.0"
description = "Interactive SoundCloud downloader, analyzer, and Rekordbox playlist importer"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "pyrekordbox>=0.4",
    "yt-dlp>=2025.1.15",
    "imageio-ffmpeg>=0.5.1",
    "mutagen>=1.47",
]

[project.scripts]
soundcloud-dl = "app.soundcloud_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
