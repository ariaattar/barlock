[project]
name = "barlock-backend"
version = "0.1.0"
description = "DJ music analysis backend — beat/bar detection, looping, Rekordbox XML export"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "numpy>=1.26,<2.0",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "soxr>=0.5",
    "torch>=2.4",
    "torchaudio>=2.4",
    "beat-this>=0.0.4",
    "pyrekordbox>=0.4",
    "yt-dlp>=2025.1.15",
    "imageio-ffmpeg>=0.5.1",
    "mutagen>=1.47",
    "rich>=13.9",
]

[project.scripts]
soundcloud-dl = "app.soundcloud_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
